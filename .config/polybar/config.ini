[colors]

background = #0d080a
foreground = #f2e9eb

wine = #8f1537
wine-dark = #3b0718
red = #ff1744
gray = #6b5860



[bar/main]
monitor = ${env:MONITOR:}

width = 100%
height = 34

offset-x = 2%
offset-y = 10

radius = 14

background = #B30D080A
foreground = ${colors.foreground}

border-size = 0

line-size = 0

padding-left = 3
padding-right = 3

module-margin = 2

separator =

font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = Symbols Nerd Font:size=11;3

modules-left = i3 music
modules-center = date
modules-right = network cpu memory pulseaudio battery tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

override-redirect = false
wm-restack = i3

tray-position = right
tray-detached = false
tray-maxsize = 18
tray-padding = 6
tray-background = #00000000


;====================
; WORKSPACES CIRCULOS
;====================


[module/i3]

type = internal/i3


pin-workspaces = true

index-sort = true


enable-click = true


ws-icon-0 = 1;○
ws-icon-1 = 2;○
ws-icon-2 = 3;○
ws-icon-3 = 4;○


format = <label-state>


label-focused = ●

label-focused-foreground = ${colors.red}

label-focused-padding = 2


label-unfocused = ○

label-unfocused-foreground = ${colors.gray}

label-unfocused-padding = 2


label-visible = ○

label-visible-foreground = ${colors.gray}

label-visible-padding = 2


label-urgent = ●

label-urgent-foreground = ${colors.red}



;====================
; MUSICA
;====================


[module/music]

type = custom/script

exec = ~/.config/polybar/scripts/music.sh

interval = 2


click-left = playerctl play-pause



;====================
; HORA
;====================


[module/date]

type = internal/date

interval = 1


date = %d %b

time = %H:%M


label = 󰥔 %time% 󰃭 %date%

label-foreground = ${colors.wine}



;====================
; CPU
;====================


[module/cpu]

type = internal/cpu

interval = 2


label = 󰍛 %percentage%%

label-foreground = ${colors.wine}



;====================
; RAM
;====================


[module/memory]

type = internal/memory

interval = 2


label = 󰘚 %percentage_used%%

label-foreground = ${colors.wine}



;====================
; VOLUMEN
;====================


[module/pulseaudio]

type = internal/pulseaudio

format-volume = <label-volume>
format-volume-foreground = ${colors.wine}

label-volume = 󰕾 %percentage%%


format-muted = <label-muted>
format-muted-foreground = ${colors.wine}

label-muted = 󰖁


click-left = pavucontrol


;====================
; BATERIA
;====================


[module/battery]

type = internal/battery

battery = BAT0
adapter = ACAD

full-at = 98


format-charging = <label-charging>
format-charging-foreground = ${colors.wine}

label-charging = 󰂄 %percentage%%


format-discharging = <label-discharging>
format-discharging-foreground = ${colors.wine}

label-discharging = 󰁹 %percentage%%


format-full = <label-full>
format-full-foreground = ${colors.wine}

label-full = 󰁹


;====================
; TRAY
;====================


[module/tray]

type = internal/tray

tray-spacing = 6



[settings]

screenchange-reload = true

pseudo-transparency = true
